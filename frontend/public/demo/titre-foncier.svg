  <text x="300" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#3b3312">TITRE FONCIER</text>
  <text x="300" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6b5d2a">Document d'illustration · aucune valeur légale</text>
  <line x1="80" y1="146" x2="520" y2="146" stroke="#b9a96b"/>
  <g font-family="Georgia, serif" font-size="17" fill="#3b3312">
    <text x="80" y="196">N° du titre :</text><text x="260" y="196" font-weight="700">TF 0000 / TH</text>
    <text x="80" y="236">Commune :</text><text x="260" y="236" font-weight="700">Thiès</text>
    <text x="80" y="276">Superficie :</text><text x="260" y="276" font-weight="700">300 m²</text>
