    <text x="80" y="356">Vérifié par :</text><text x="260" y="356" font-weight="700">cabinet de géomètre</text>
  </g>
  <rect x="90" y="400" width="420" height="260" fill="#f2ecd6" stroke="#8a7a4a" stroke-width="2"/>
  <polygon points="150,450 450,450 480,610 130,610" fill="#e3d9b0" stroke="#6b5d2a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6b5d2a">plan de la parcelle (schéma)</text>
