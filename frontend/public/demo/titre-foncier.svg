  <text x="470" y="706" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5d2a">CACHET</text>
  <g transform="rotate(-24 300 400)" opacity="0.16">
    <text x="300" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="700" fill="#7a1f1f">EXEMPLE</text>
