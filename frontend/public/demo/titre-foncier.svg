<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#fbf8ef"/>
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#8a7a4a" stroke-width="3"/>
