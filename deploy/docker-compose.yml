# NobPay on one small server: the app + Caddy (automatic HTTPS). Usage: see docs/DEPLOIEMENT.md
#   cp deploy/.env.example deploy/.env   (fill it in, never commit it)
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ../frontend
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - nobpay-data:/data
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nobpay-data:
  caddy-data:
  caddy-config:
